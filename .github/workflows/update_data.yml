name: Update NFL Predictions

on:
  schedule:
    # Run at 9 AM EST (14:00 UTC) every day
    - cron: '0 14 * * *'
  workflow_dispatch:
    # Also allow manual trigger from the GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run NFL prediction pipeline
        run: python scripts/pipeline.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit updated data files
        run: |
          git config user.name "NFL Dashboard Bot"
          git config user.email "nfl-dashboard-bot@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && echo "No data changes to commit" || (
            git commit -m "Auto-update: NFL predictions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
